# SQE: shared test environment. Secrets are ${PLACEHOLDERS}: set these environment variables on the server.
#   DB_PASSWORD  SUPER_ADMIN_EMAIL  JWT_SECRET (openssl rand -base64 48)  SMTP_USER  SMTP_PASS
# Use a DIFFERENT JWT secret in every environment.

juristrack.env=sqe
logging.level.com.jurislpo.juristrack=INFO

server.port=8092

spring.datasource.url=jdbc:postgresql://localhost:5447/juristrack_sqe?currentSchema=public
spring.datasource.username=juristrack
spring.datasource.password=${DB_PASSWORD}

juristrack.app-url=http://localhost:3017

juristrack.security.jwt-secret=${JWT_SECRET}
# served over http: the session cookies cannot be Secure here
juristrack.security.cookie-secure=false

# no fixed sign-in code: real random codes, emailed
juristrack.otp.fixed-code=

# The seed command creates this platform super admin (no business) if missing
juristrack.seed.super-admin-email=${SUPER_ADMIN_EMAIL:}
# Demo business (owner, a manager, four employees reporting to the manager; fake emails @demo.juristrack.test): dev and sqe only
juristrack.seed.demo=true

juristrack.mail.host=smtp.example.com
juristrack.mail.port=587
juristrack.mail.username=${SMTP_USER}
juristrack.mail.password=${SMTP_PASS}
juristrack.mail.from=JurisTrack (SQE) <no-reply@jurislpo.com>

# Embedded in JurisOne: the JurisOne API is the gateway (/api/juris-track/** -> this API) and sends a short-lived JWT
# (Authorization: Bearer) signed with JurisOne's private key; this API holds only the public key (PEM, RSA or EC).
# Standalone use (own emailed-code sign-in) works either way. Set enabled=true when this environment sits behind JurisOne SQE (JURISONE_PUBLIC_KEY must then be set).
juristrack.integration.enabled=false
juristrack.integration.issuer=http://localhost:3015
juristrack.integration.audience=juristrack
juristrack.integration.public-key=${JURISONE_PUBLIC_KEY:}
juristrack.integration.clock-skew-seconds=30
