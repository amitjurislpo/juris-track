# JurisTrack API: settings shared by every environment.
# Each environment adds its own in application-<env>.properties (dev, sqe, uat, prd); the active one is chosen by
# SPRING_PROFILES_ACTIVE (default dev). Secrets of sqe, uat and prd are NOT in these files:
# they are ${PLACEHOLDERS} filled from the server's environment variables.

spring.profiles.default=dev
spring.application.name=juristrack-backend

server.port=8082
server.forward-headers-strategy=none

# spring.datasource.url / username / password: see application-<env>.properties
spring.jpa.open-in-view=false
# the schema is owned by Flyway; never update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# columns named "before", "after"
spring.jpa.properties.hibernate.auto_quote_keyword=true

# fresh schema: every database is built by Flyway from V1 (no data is migrated from the old app)
spring.flyway.baseline-on-migrate=false

# data keeps explicit nulls (ApiResult omits its own empty fields)
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── JurisTrack ──
# The only origin the API accepts requests from (CORS, and the Origin check on every cookie-authenticated write): the web app's public URL
juristrack.frontend-origin=${juristrack.app-url}

# Sign-in by emailed code: a code works once, for code-ttl-minutes and max-attempts wrong tries. Per window-minutes: at most
# requests-per-ip / requests-per-email code requests and failed-sign-ins-per-ip wrong codes (then 429).
juristrack.otp.code-ttl-minutes=10
juristrack.otp.max-attempts=5
juristrack.otp.requests-per-ip=10
juristrack.otp.requests-per-email=5
juristrack.otp.failed-sign-ins-per-ip=20
juristrack.otp.window-minutes=15

# The session: jt_at = JWT access token (access-token-ttl-seconds, renewed silently), jt_rt = refresh token that rotates on
# every use. With "keep me signed in" the session lasts session-ttl-days, otherwise short-session-hours (and ends with the
# browser). A used refresh token presented again after refresh-reuse-grace-seconds revokes the whole session (stolen copy).
juristrack.security.access-token-ttl-seconds=300
juristrack.security.session-ttl-days=30
juristrack.security.short-session-hours=12
juristrack.security.refresh-reuse-grace-seconds=30
# Secure cookies (https only): true wherever the app is served over https
juristrack.security.cookie-secure=false

juristrack.mail.port=587
# The reset command refuses a database whose app-url is not localhost unless this is true
juristrack.allow-database-reset=false
