# DEV: local development. Verbose logs. Everything here is a local-only value (nothing is a real secret),
# so this one file is all the dev environment needs.

juristrack.env=dev
logging.level.com.jurislpo.juristrack=DEBUG

server.port=8081

# Postgres from docker-compose (docker compose up -d db): host port 5437
spring.datasource.url=jdbc:postgresql://localhost:5437/juristrack?currentSchema=public
spring.datasource.username=juristrack
spring.datasource.password=juristrack_dev_pw

# The web app's public URL
juristrack.app-url=http://localhost:3006

# Signs the 5-minute JWT access tokens (HS256), at least 32 bytes
juristrack.security.jwt-secret=hB0vXq3mR7tK2sLw9YpE4cNf8ZuJ6aGd1QiVxTo5WkMr3HyBn7CeUs2PlFzA0gDj

# Only dev may use a fixed sign-in code. sqe, uat and prd leave it empty: real random codes, emailed.
juristrack.otp.fixed-code=000000

# The seed command creates this platform super admin (no business) if missing
juristrack.seed.super-admin-email=admin@jurislpo.com
# Demo business (owner, a manager, four employees reporting to the manager; fake emails @demo.juristrack.test): dev and sqe only
juristrack.seed.demo=true

# Empty host: emails are written to the server log (the sign-in code is printed there)
juristrack.mail.host=
juristrack.mail.username=
juristrack.mail.password=
juristrack.mail.from=JurisTrack (DEV) <no-reply@jurislpo.com>

# Embedded in JurisOne: the JurisOne API is the gateway (/api/juris-track/** -> this API) and sends a short-lived JWT
# (Authorization: Bearer) signed with JurisOne's private key; this API holds only the public key (PEM, RSA or EC).
# Standalone use (own emailed-code sign-in) works either way. Embedded mode off by default in dev; to try it, set enabled=true and paste the public key of a local JurisOne.
# Embedded in JurisOne (local dev only: this key pair exists only on this machine; sqe/uat/prd take the public key from JURISONE_PUBLIC_KEY)
juristrack.integration.enabled=true
juristrack.integration.issuer=http://localhost:3005
juristrack.integration.audience=juristrack
juristrack.integration.public-
juristrack.integration.clock-skew-seconds=30
