# Postgres (and, optionally, the API) in Docker. The defaults below are for development:
#   docker compose up -d db                 # Postgres 16 on 127.0.0.1:5437, then run the API with Maven (see README)
#   docker compose up -d --build backend    # the API in Docker too (APP_ENV=dev), on port 8082
# Other environments run side by side by setting these variables (shell, systemd or a CI job), e.g. for sqe:
#   COMPOSE_PROJECT_NAME=juristrack-sqe APP_ENV=sqe DB_PORT=5447 BACKEND_PORT=8092 POSTGRES_DB=juristrack_sqe \
#   POSTGRES_PASSWORD=... JWT_SECRET=... SMTP_USER=... SMTP_PASS=... docker compose up -d
# Each project name gets its own containers and volumes. The API's settings are in the jar's
# application-<env>.properties; only the database address and the secrets are passed here.
# The project is named explicitly (containers juristrack-backend-db / -backend) so it never adopts the containers of the old
# Next.js app (compose project "juristrack", container juristrack-db-1 on port 5432).
name: juristrack-backend

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-juristrack-backend}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juristrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juristrack_dev_pw}   # dev default; set it for every other environment
      POSTGRES_DB: ${POSTGRES_DB:-juristrack}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5437}:5432"
    volumes:
      - juristrack_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot API (BACKEND_PORT on the host, 8082 inside). The web app (juris-track-frontend) proxies /api/* to it.
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-juristrack-backend}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev}
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-juristrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juristrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juristrack_dev_pw}
      # secrets of sqe / uat / prd (dev has its own values in application-dev.properties)
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # embedded in JurisOne (juristrack.integration.enabled=true): JurisOne's public key
      JURISONE_PUBLIC_KEY: ${JURISONE_PUBLIC_KEY:-}
    ports:
      - "${BACKEND_PORT:-8082}:8082"

volumes:
  juristrack_pg:
