services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-juristrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juristrack}
      POSTGRES_DB: ${POSTGRES_DB:-juristrack}
    ports:
      - "5432:5432"
    volumes:
      - juristrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-juristrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  juristrack-db:
